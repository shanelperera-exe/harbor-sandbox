name: CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Allows you to manually trigger the deployment from GitHub UI


env:
  ACR_LOGIN_SERVER: youracr.azurecr.io # TODO: set ACR login server
  AZURE_WEBAPP_NAME: harbor-app-service # TODO: set App Service name

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    # Dynamically select the GitHub Environment based on the branch
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push ApiGateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: src/backend/Harbor.ApiGateway/Dockerfile
        push: true
        tags: ${{ env.ACR_LOGIN_SERVER }}/harbor-api-gateway:${{ github.sha }}

    # (Add other build-push-actions here for the other 7 services)

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}

    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App for Containers
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.ACR_LOGIN_SERVER }}/harbor-api-gateway:${{ github.sha }}

    # We map the variables that were previously in the .env file directly to Azure App Service settings
    - name: Update Azure App Service Settings
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
            { "name": "POSTGRES_SERVER", "value": "${{ vars.POSTGRES_SERVER }}" },
            { "name": "POSTGRES_PORT", "value": "${{ vars.POSTGRES_PORT }}" },
            { "name": "POSTGRES_DATABASE", "value": "${{ vars.POSTGRES_DATABASE }}" },
            { "name": "POSTGRES_USER", "value": "${{ vars.POSTGRES_USER }}" },
            { "name": "POSTGRES_PASSWORD", "value": "${{ secrets.POSTGRES_PASSWORD }}" },
            { "name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}" },
            { "name": "JWT_ISSUER", "value": "${{ vars.JWT_ISSUER }}" },
            { "name": "JWT_AUDIENCE", "value": "${{ vars.JWT_AUDIENCE }}" },
            { "name": "ADMIN_EMAIL", "value": "${{ vars.ADMIN_EMAIL }}" },
            { "name": "ADMIN_PASSWORD", "value": "${{ secrets.ADMIN_PASSWORD }}" },
            { "name": "API_GATEWAY_URL", "value": "${{ vars.API_GATEWAY_URL }}" },
            { "name": "KAFKA_BOOTSTRAP_SERVERS", "value": "${{ vars.KAFKA_BOOTSTRAP_SERVERS }}" },
            { "name": "KAFKA_DEPLOYMENT_TOPIC", "value": "${{ vars.KAFKA_DEPLOYMENT_TOPIC }}" },
            { "name": "SMTP_HOST", "value": "${{ vars.SMTP_HOST }}" },
            { "name": "SMTP_PORT", "value": "${{ vars.SMTP_PORT }}" },
            { "name": "SMTP_USERNAME", "value": "${{ vars.SMTP_USERNAME }}" },
            { "name": "SMTP_PASSWORD", "value": "${{ secrets.SMTP_PASSWORD }}" },
            { "name": "SMTP_FROM_NAME", "value": "${{ vars.SMTP_FROM_NAME }}" },
            { "name": "SMTP_FROM_EMAIL", "value": "${{ vars.SMTP_FROM_EMAIL }}" }
          ]
